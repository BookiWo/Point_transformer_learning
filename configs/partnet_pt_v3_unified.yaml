# Point Transformer V3 — Unified PartNet Training (ALL 50 categories)
#
# Uses serialized attention + spconv CPE.
# Conservative settings for 32GB GPU (32M params, batch=4 + grad_accum=4).

experiment:
  name: exp_pt_partnet_v3_unified
  output_dir: experiments/exp_pt_partnet_v3_unified

dataset:
  processed_root: datasets/processed/partnet_full
  num_points: 2048

training:
  batch_size: 4
  num_workers: 4
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  device: auto
  log_interval: 200
  save_every: 10
  grad_accum: 4

logging:
  tensorboard: false

model:
  model_type: ptv3

  in_channels: 3
  grid_size: 0.05

  # Encoder (5 stages)
  stride: [2, 2, 2, 2]
  enc_depths: [2, 2, 2, 2, 2]
  enc_channels: [32, 64, 128, 256, 512]
  enc_num_head: [2, 4, 8, 16, 32]
  enc_patch_size: [1024, 1024, 1024, 1024, 1024]

  # Decoder (4 stages)
  dec_depths: [2, 2, 2, 2]
  dec_channels: [64, 64, 128, 256]
  dec_num_head: [4, 4, 8, 16]
  dec_patch_size: [1024, 1024, 1024, 1024]

  # Shared
  mlp_ratio: 2.0
  attn_drop: 0.0
  proj_drop: 0.1
  drop_path: 0.1
  enable_rpe: false

  # Serialization
  order: ["z", "z-trans"]
  shuffle_orders: true

loss:
  ignore_index: -1
